[workspace]
authors = ["Kasper Munch <kaspermunch@birc.au.dk>"]
channels = ["conda-forge", "munch-group"]
name = "mikkel"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]
segments = { description = "Download segments from the cluster", cmd = "scp login.genome.au.dk:~/GenerationInterval/people/kmt/segments.parquet ." }

[dependencies]
pandas = ">=3.0.3,<4"
numpy = ">=2.5.0,<3"
pyarrow = ">=24.0.0,<25"
geneinfo = ">=5.6.39,<6"
vscodenb = ">=0.1.83,<0.2"
seaborn = ">=0.13.2,<0.14"
jupyter = ">=1.1.1,<2"
nodejs = ">=26.3.1,<26.4"
nbconvert = ">=7.17.1,<8"
ipykernel = ">=7.3.0,<8"
